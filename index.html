<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProductivityHub | To-Do List</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        .card { background: white; border-radius: 24px; padding: 30px; margin-top: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        h1 { text-align: center; color: #667eea; margin-bottom: 20px; }
        input, textarea, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; }
        button { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .task-item { background: #f8f9ff; padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .task-completed { text-decoration: line-through; opacity: 0.6; }
        .btn-complete { background: #27ae60; padding: 5px 10px; font-size: 12px; }
        .btn-delete { background: #e74c3c; padding: 5px 10px; font-size: 12px; }
        .filters { display: flex; gap: 10px; margin: 20px 0; flex-wrap: wrap; }
        .filter-btn { background: #eee; color: #333; padding: 8px 16px; }
        .filter-btn.active { background: #667eea; color: white; }
        .stats { background: #e8ecff; padding: 15px; border-radius: 12px; margin: 20px 0; text-align: center; }
        .progress-bar { height: 10px; background: #ddd; border-radius: 10px; margin-top: 10px; }
        .progress-fill { height: 100%; background: #27ae60; border-radius: 10px; width: 0%; }
        .nav { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
        .nav a { color: white; text-decoration: none; padding: 8px 16px; background: rgba(255,255,255,0.2); border-radius: 20px; cursor: pointer; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav">
            <a onclick="showPage('home')">🏠 Beranda</a>
            <a onclick="showPage('login')">🔐 Masuk</a>
            <a onclick="showPage('register')">📝 Daftar</a>
        </div>

        <!-- HALAMAN HOME -->
        <div id="homePage" class="card">
            <h1>🧠 ProductivityHub</h1>
            <p style="text-align:center; margin:20px 0">Kelola tugas dan catatan dengan mudah. Gratis selamanya!</p>
            <button onclick="showPage('register')" style="width:100%">🚀 Mulai Sekarang</button>
        </div>

        <!-- HALAMAN LOGIN -->
        <div id="loginPage" class="card hidden">
            <h1>🔐 Masuk</h1>
            <input type="email" id="loginEmail" placeholder="Email">
            <input type="password" id="loginPassword" placeholder="Password">
            <button onclick="login()">Masuk</button>
            <p id="loginMsg" style="color:red; margin-top:10px"></p>
        </div>

        <!-- HALAMAN REGISTER -->
        <div id="registerPage" class="card hidden">
            <h1>📝 Daftar</h1>
            <input type="text" id="regName" placeholder="Nama">
            <input type="email" id="regEmail" placeholder="Email">
            <input type="password" id="regPassword" placeholder="Password (min 6)">
            <button onclick="register()">Daftar</button>
            <p id="registerMsg" style="color:red; margin-top:10px"></p>
        </div>

        <!-- HALAMAN DASHBOARD -->
        <div id="dashboardPage" class="card hidden">
            <div style="display:flex; justify-content:space-between; align-items:center">
                <h1>📋 ProductivityHub</h1>
                <button onclick="logout()" style="background:#e74c3c">🚪 Keluar</button>
            </div>
            <p id="userName" style="color:#667eea; margin-bottom:20px"></p>
            
            <div class="filters">
                <button class="filter-btn active" onclick="setFilter('all')">Semua</button>
                <button class="filter-btn" onclick="setFilter('pending')">Belum</button>
                <button class="filter-btn" onclick="setFilter('completed')">Selesai</button>
            </div>

            <div style="display:flex; gap:10px; margin-bottom:20px">
                <input type="text" id="newTask" placeholder="Tugas baru..." style="flex:1">
                <button onclick="addTask()">+ Tambah</button>
            </div>

            <div id="tasksList"></div>

            <div class="stats">
                <div>📊 Statistik</div>
                <div>Total: <span id="totalTasks">0</span> | Selesai: <span id="completedTasks">0</span> | <span id="percentTasks">0</span>%</div>
                <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let currentFilter = 'all';
        let users = JSON.parse(localStorage.getItem('users') || '[]');
        
        function saveUsers() { localStorage.setItem('users', JSON.stringify(users)); }
        function showPage(page) {
            document.getElementById('homePage').classList.add('hidden');
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('registerPage').classList.add('hidden');
            document.getElementById('dashboardPage').classList.add('hidden');
            document.getElementById(page + 'Page').classList.remove('hidden');
        }

        function register() {
            let name = document.getElementById('regName').value;
            let email = document.getElementById('regEmail').value;
            let pass = document.getElementById('regPassword').value;
            if (pass.length < 6) { document.getElementById('registerMsg').innerText = 'Password minimal 6 karakter!'; return; }
            if (users.find(u => u.email === email)) { document.getElementById('registerMsg').innerText = 'Email sudah terdaftar!'; return; }
            users.push({ id: Date.now(), name, email, password: pass, tasks: [] });
            saveUsers();
            document.getElementById('registerMsg').innerHTML = '<span style="color:green">✅ Berhasil! Silakan login.</span>';
            setTimeout(() => showPage('login'), 1500);
        }

        function login() {
            let email = document.getElementById('loginEmail').value;
            let pass = document.getElementById('loginPassword').value;
            let user = users.find(u => u.email === email && u.password === pass);
            if (!user) { document.getElementById('loginMsg').innerText = 'Email atau password salah!'; return; }
            currentUser = user;
            document.getElementById('userName').innerHTML = `👤 Selamat datang, ${user.name}`;
            showPage('dashboard');
            renderTasks();
        }

        function logout() { currentUser = null; showPage('home'); }

        function addTask() {
            let title = document.getElementById('newTask').value.trim();
            if (!title) return;
            currentUser.tasks.push({ id: Date.now(), title, completed: false });
            saveUsers();
            document.getElementById('newTask').value = '';
            renderTasks();
        }

        function toggleTask(id) {
            let task = currentUser.tasks.find(t => t.id === id);
            if (task) task.completed = !task.completed;
            saveUsers();
            renderTasks();
        }

        function deleteTask(id) {
            if (confirm('Hapus tugas?')) {
                currentUser.tasks = currentUser.tasks.filter(t => t.id !== id);
                saveUsers();
                renderTasks();
            }
        }

        function setFilter(filter) { currentFilter = filter; renderTasks(); }

        function renderTasks() {
            if (!currentUser) return;
            let filtered = [...currentUser.tasks];
            if (currentFilter === 'pending') filtered = filtered.filter(t => !t.completed);
            if (currentFilter === 'completed') filtered = filtered.filter(t => t.completed);
            
            let html = filtered.map(task => `
                <div class="task-item ${task.completed ? 'task-completed' : ''}">
                    <span>${task.title}</span>
                    <div>
                        <button class="btn-complete" onclick="toggleTask(${task.id})">${task.completed ? '↺ Batal' : '✓ Selesai'}</button>
                        <button class="btn-delete" onclick="deleteTask(${task.id})">🗑 Hapus</button>
                    </div>
                </div>
            `).join('');
            document.getElementById('tasksList').innerHTML = html || '<p style="text-align:center">✨ Belum ada tugas</p>';
            
            let total = currentUser.tasks.length;
            let completed = currentUser.tasks.filter(t => t.completed).length;
            let percent = total === 0 ? 0 : Math.round(completed / total * 100);
            document.getElementById('totalTasks').innerText = total;
            document.getElementById('completedTasks').innerText = completed;
            document.getElementById('percentTasks').innerText = percent;
            document.getElementById('progressFill').style.width = percent + '%';
            
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.innerText.includes(currentFilter === 'all' ? 'Semua' : currentFilter === 'pending' ? 'Belum' : 'Selesai')) 
                    btn.classList.add('active');
            });
        }
    </script>
</body>
</html>
